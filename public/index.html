<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Anjum Downloader</title>

<!-- Favicon -->
<link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Crect width='100' height='100' rx='20' fill='%23ff6a00'/%3E%3Cpath d='M50 20 L50 70 M30 50 L50 70 L70 50 M20 80 L80 80' stroke='white' stroke-width='8' fill='none' stroke-linecap='round'/%3E%3C/svg%3E">

<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;800;900&display=swap" rel="stylesheet">
<style>
  *{margin:0;padding:0;box-sizing:border-box;font-family:'Inter',sans-serif;transition:background .3s,color .3s}
  :root{--orange:#ff6a00;--red:#c8102e;--bg:#0a0508;--card:#15101a;--border:#2a1a1a;--text:#f0e6d2;--dim:#8a7a6a;--green:#2ecc71;--blue:#3498db}
  body{background:var(--bg);color:var(--text);min-height:100vh;padding:1rem;display:flex;justify-content:center}
  .app{width:100%;max-width:800px;padding:1rem 0}
  
  .header{display:flex;justify-content:space-between;align-items:center;margin-bottom:2rem}
  .brand{display:flex;align-items:center;gap:12px}
  .brand-icon{width:50px;height:50px;border-radius:14px;background:linear-gradient(135deg,var(--orange),var(--red));display:flex;align-items:center;justify-content:center;color:#fff;font-size:1.4rem;box-shadow:0 4px 15px rgba(255,106,0,0.3)}
  .brand h1{font-size:1.4rem;font-weight:900;background:linear-gradient(135deg,var(--orange),#f0c000);-webkit-background-clip:text;-webkit-text-fill-color:transparent}
  .brand span{font-size:0.7rem;color:var(--dim);letter-spacing:1px;font-weight:600}
  
  .hero{text-align:center;margin-bottom:2rem}
  .hero h2{font-size:1.8rem;font-weight:900;margin-bottom:0.5rem}
  .hero h2 span{color:var(--orange)}
  .hero p{color:var(--dim);font-size:0.9rem}
  
  .search-box{background:var(--card);border:1px solid var(--border);border-radius:1.2rem;padding:1.2rem;display:flex;gap:0.8rem;flex-wrap:wrap;margin-bottom:2rem;box-shadow:0 10px 30px rgba(0,0,0,0.5)}
  .search-box textarea{flex:1;min-width:200px;background:var(--bg);border:1px solid var(--border);border-radius:0.8rem;padding:1rem;color:var(--text);font-size:0.9rem;outline:none;resize:none;height:60px;font-family:monospace}
  .search-box textarea:focus{border-color:var(--orange)}
  .search-box button{background:linear-gradient(135deg,var(--orange),var(--red));border:none;color:#fff;padding:0 2rem;border-radius:0.8rem;font-weight:800;cursor:pointer;font-size:1rem;display:flex;align-items:center;gap:8px;min-height:60px;transition:transform 0.2s}
  .search-box button:hover{transform:scale(1.02)}
  .search-box button:disabled{opacity:0.6;cursor:not-allowed;transform:none}
  
  .loader{display:none;text-align:center;padding:3rem 1rem}
  .loader i{font-size:3rem;color:var(--orange);margin-bottom:1rem;animation:spin 1s linear infinite}
  .loader p{color:var(--dim);font-weight:600}
  @keyframes spin{100%{transform:rotate(360deg)}}
  
  .result{display:none;background:var(--card);border:1px solid var(--border);border-radius:1.2rem;overflow:hidden;animation:slideUp 0.4s ease-out;box-shadow:0 10px 30px rgba(0,0,0,0.5)}
  @keyframes slideUp{from{opacity:0;transform:translateY(20px)}to{opacity:1;transform:translateY(0)}}
  
  .poster{position:relative;width:100%;aspect-ratio:16/9;background:#000}
  .poster img{width:100%;height:100%;object-fit:cover}
  .poster-info{position:absolute;bottom:0;left:0;right:0;padding:3rem 1.5rem 1.5rem;background:linear-gradient(transparent,rgba(0,0,0,0.95))}
  .poster-title{color:#fff;font-size:1.2rem;font-weight:800;margin-bottom:0.5rem;line-height:1.3}
  .poster-meta{color:#ccc;font-size:0.85rem;font-weight:500}
  
  .formats{padding:1.5rem;display:flex;flex-direction:column;gap:0.8rem}
  .fmt-row{display:flex;justify-content:space-between;align-items:center;background:var(--bg);padding:1rem 1.5rem;border-radius:1rem;border:1px solid var(--border);transition:border-color 0.2s}
  .fmt-row:hover{border-color:var(--orange)}
  .fmt-info{font-weight:800;font-size:1rem;display:flex;flex-direction:column;gap:4px}
  .fmt-size{font-size:0.75rem;color:var(--dim);font-weight:600}
  .dl-btn{background:var(--green);border:none;color:#fff;padding:0.8rem 1.5rem;border-radius:2rem;font-size:0.85rem;font-weight:800;cursor:pointer;display:flex;align-items:center;gap:8px;transition:transform 0.2s}
  .dl-btn:hover{transform:scale(1.05)}
  .dl-btn.audio{background:var(--blue)}
  
  .toast{position:fixed;bottom:30px;left:50%;transform:translateX(-50%) translateY(100px);background:var(--card);border:1px solid var(--orange);padding:1rem 2rem;border-radius:3rem;font-size:0.9rem;font-weight:700;transition:0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275);z-index:999;box-shadow:0 10px 30px rgba(0,0,0,0.5)}
  .toast.show{transform:translateX(-50%) translateY(0)}
</style>
</head>
<body>
<div class="app">
  <div class="header">
    <div class="brand">
      <div class="brand-icon"><i class="fas fa-bolt"></i></div>
      <div>
        <h1>AnjumDownloader</h1>
        <span>WASMER EDITION</span>
      </div>
    </div>
  </div>

  <div class="hero">
    <h2>Download YouTube <span>Video & Audio</span></h2>
    <p>Paste a link or embed code to get started</p>
  </div>

  <div class="search-box">
    <textarea id="urlInput" placeholder="Paste YouTube Link OR <iframe> Embed Code here..."></textarea>
    <button onclick="handleDownload()" id="mainBtn">
      <i class="fas fa-search"></i> Get Links
    </button>
  </div>

  <div class="loader" id="loadingBox">
    <i class="fas fa-cog"></i>
    <p>Fetching video info... Please wait.</p>
  </div>

  <div class="result" id="resultBox">
    <div class="poster">
      <img id="posterImg" src="" alt="poster">
      <div class="poster-info">
        <div class="poster-title" id="posterTitle">Video Title</div>
        <div class="poster-meta" id="posterMeta">Channel Name</div>
      </div>
    </div>
    <div class="formats" id="fmtList"></div>
  </div>
</div>

<div class="toast" id="toast">Message</div>

<script>
// ⚠️ Yahan apna Wasmer Wala URL dalein (jo deploy ke baad milega)
const API_URL = 'https://your-app.wasmer.app/api/download';

// Link ya Iframe code se URL nikalna
function extractUrl(input) {
    let url = input.trim();
    // Iframe support
    if (url.includes('<iframe') && url.includes('src=')) {
        const match = url.match(/src="([^"]+)"/) || url.match(/src='([^']+)'/);
        if (match && match[1]) url = match[1];
    }
    // youtu.be link
    if (url.includes('youtu.be/')) {
        return `https://www.youtube.com/watch?v=${url.split('youtu.be/')[1].split('?')[0]}`;
    } 
    // watch?v= link
    if (url.includes('youtube.com/watch')) {
        return `https://www.youtube.com/watch?v=${url.split('v=')[1].split('&')[0]}`;
    }
    // embed link
    if (url.includes('youtube.com/embed/')) {
        return `https://www.youtube.com/watch?v=${url.split('embed/')[1].split('?')[0]}`;
    }
    return url;
}

async function handleDownload() {
  const rawInput = document.getElementById('urlInput').value;
  if (!rawInput) return showToast('⚠️ Paste a link first!');

  const cleanUrl = extractUrl(rawInput);
  if (!cleanUrl.includes('youtube.com') && !cleanUrl.includes('youtu.be')) {
      return showToast('⚠️ Invalid YouTube Link!');
  }

  const btn = document.getElementById('mainBtn');
  const loading = document.getElementById('loadingBox');
  const resultBox = document.getElementById('resultBox');
  
  btn.innerHTML = '<i class="fas fa-spinner fa-spin"></i> Fetching...';
  btn.disabled = true;
  loading.style.display = 'block';
  resultBox.classList.remove('show');

  try {
    // Wasmer API ko call karein
    const res = await fetch(`${API_URL}?url=${encodeURIComponent(cleanUrl)}`);
    const data = await res.json();
    
    if (data.error) throw new Error(data.error);

    // UI mein Thumbnail aur Title set karein
    document.getElementById('posterImg').src = data.thumbnail;
    document.getElementById('posterTitle').innerText = data.title;
    document.getElementById('posterMeta').innerText = "YouTube Video";
    
    // Direct Download Buttons generate karein
    const list = document.getElementById('fmtList');
    list.innerHTML = `
      <div class="fmt-row">
        <div class="fmt-info">Video (MP4)
          <span class="fmt-size">High Quality</span>
        </div>
        <button class="dl-btn" onclick="startDownload('${data.video_url}')">
          <i class="fas fa-download"></i> Download MP4
        </button>
      </div>
      <div class="fmt-row">
        <div class="fmt-info">Audio (MP3)
          <span class="fmt-size">Audio Only</span>
        </div>
        <button class="dl-btn audio" onclick="startDownload('${data.audio_url}')">
          <i class="fas fa-download"></i> Download MP3
        </button>
      </div>
    `;

    resultBox.classList.add('show');
    
  } catch (e) {
    showToast('❌ ' + e.message);
  } finally {
    btn.innerHTML = '<i class="fas fa-search"></i> Get Links';
    btn.disabled = false;
    loading.style.display = 'none';
  }
}

function startDownload(url) {
  if (!url) return showToast('Download link not found. YouTube block ho sakta hai.');
  window.open(url, '_blank');
  showToast('🚀 Download Started!');
}

let toastTimer;
function showToast(msg) {
  const t = document.getElementById('toast');
  t.innerText = msg;
  t.classList.add('show');
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => t.classList.remove('show'), 3500);
}
</script>
</body>
</html>
